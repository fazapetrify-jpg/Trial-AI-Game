name: Apply v4 final package

on:
  push:
    branches:
      - chatgpt-v4-final-push

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply v4 package
        run: |
          cat .v4chunks/chunk-* > /tmp/v4.b64
          base64 -d /tmp/v4.b64 > /tmp/v4.zip
          mkdir -p /tmp/v4unpack
          unzip -q /tmp/v4.zip -d /tmp/v4unpack
          cp -a /tmp/v4unpack/Trial-AI-Game-main/. .
          rm -rf .v4chunks
          rm -f .github/workflows/apply-v4-final.yml

      - name: Commit final v4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v4 final fixed song guide"
          git push origin HEAD:chatgpt-v4-final-push
