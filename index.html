<body>
<div class="app">
  <header>
    <div id="badgeRow">
      <div class="badge">TANTANGAN HARIAN</div>
    </div>
    <h1>Interactive Hearing Game</h1>
    <div class="sub" style="margin-top:-2px;">by Musti Musik</div>
    <div class="sub" id="dateLabel"></div>
  </header>

  <div class="card" id="mainCard">
    <!-- content injected by JS -->
  </div>

  <footer id="footerNote"></footer>
</div>

<script>
// ---------- Config ----------
const SITE_URL = "mustimusik.id/tebaknada";
const STORAGE_KEY = "tebaknada_progress_v1";

const MODES = {
  interval: { label:'Tebak Nada', short:'Interval', icon:'🎧', desc:'Tebak jarak antar 2 nada', title:'🎧 Tebak Nada' },
  chord: { label:'Tebak Chord', short:'Chord', icon:'🎹', desc:'Tebak kualitas chord', title:'🎹 Tebak Chord' },
  progression: { label:'Tebak Progresi', short:'Progresi', icon:'🎼', desc:'Tebak urutan chord', title:'🎼 Tebak Progresi' },
  all: { label:'Tebak Ketiganya', short:'Campuran', icon:'🎯', desc:'Interval, chord, & progresi dicampur', title:'🎯 Tebak Semua' },
  song: { label:'Latihan Tebak Chord Lagu', short:'Chord Lagu', icon:'🎵', desc:'Tebak chord lewat cuplikan lagu', title:'🎵 Tebak Chord Lagu' }
};

// ---------- Audio Engine ----------
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
function getCtx(){
  if(!actx) actx = new AudioCtx();
  return actx;
}
function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }

function playNote(midi, startTime, duration, gainVal=0.22){
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = midiToFreq(midi);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainVal, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}

function playSequence(notes){
  const ctx = getCtx();
  if(ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime + 0.05;
  notes.forEach(n=>{
    playNote(n.midi, now + n.offset, n.dur || 1.1, n.gain || 0.22);
  });
}

function playChord(midis, dur=1.6){
  playSequence(midis.map(m=>({midi:m, offset:0, dur})));
}

function playMelodicInterval(root, interval, dur=0.8){
  playSequence([
    {midi:root, offset:0, dur},
    {midi:root+interval, offset:dur*0.85, dur}
  ]);
}

function playProgression(chords, chordDur=1.0, gap=0.05){
  const notes = [];
  chords.forEach((chord, i)=>{
    const offset = i * (chordDur+gap);
    chord.forEach(m=> notes.push({midi:m, offset, dur:chordDur}));
  });
  playSequence(notes);
}

// ---------- Question bank ----------

function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
function shuffle(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function dateSeed(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function todayString(){
  const d = new Date();
  return d.toLocaleDateString('id-ID', {weekday:'long', month:'long', day:'numeric'});
}
function msUntilMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0,0,0,0);
  return next - now;
}
function formatCountdown(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

function makeIntervalQuestion(name, rng, root){
  const semis = INTERVALS[name];
  const distractors = shuffle(Object.keys(INTERVALS).filter(n=>n!==name), rng).slice(0,3);
  const options = shuffle([name, ...distractors], rng);
  return {
    type:'interval',
    title:'Interval apa ini?',
    play: ()=> playMelodicInterval(root + Math.floor(rng()*4), semis),
    options, answer:name
  };
}
function makeChordQuestion(name, rng, root){
  const shape = CHORDS[name];
  const distractors = shuffle(Object.keys(CHORDS).filter(n=>n!==name), rng).slice(0,3);
  const options = shuffle([name, ...distractors], rng);
  return {
    type:'chord',
    title:'Ini kualitas chord apa?',
    play: ()=>{
      const r = root + Math.floor(rng()*4) - 2;
      playChord(shape.map(s=>r+s));
    },
    options, answer:name
  };
}
function makeProgressionQuestion(name, rng, root){
  const degrees = PROGRESSIONS[name];
  const distractors = shuffle(Object.keys(PROGRESSIONS).filter(n=>n!==name), rng).slice(0,3);
  const options = shuffle([name, ...distractors], rng);
  return {
    type:'progression',
    title:'Tebak progresi ini',
    play: ()=>{
      const r = root - 12;
      const chords = degrees.map(deg=> [r+deg, r+deg+4, r+deg+7]);
      playProgression(chords, 0.85, 0.03);
    },
    options, answer:name
  };
}

// Build questions for a given mode: 'interval' | 'chord' | 'progression' | 'all'
function buildQuestions(seed, mode){
  const rng = seededRandom(seed);
  const root = 60; // C4
  const qs = [];

  if(mode === 'interval'){
    const names = shuffle(Object.keys(INTERVALS), rng).slice(0,6);
    names.forEach(name=> qs.push(makeIntervalQuestion(name, rng, root)));
  } else if(mode === 'chord'){
    const names = shuffle(Object.keys(CHORDS), rng).slice(0,6);
    names.forEach(name=> qs.push(makeChordQuestion(name, rng, root)));
  } else if(mode === 'progression'){
    const names = shuffle(Object.keys(PROGRESSIONS), rng).slice(0,5);
    names.forEach(name=> qs.push(makeProgressionQuestion(name, rng, root)));
  } else {
    // 'all' — mix of 2 interval, 2 chord, 2 progression
    const easyIntervals = ['Perfect 5th','Octave','Perfect 4th','Major 3rd'];
    const medIntervals = ['Minor 3rd','Major 2nd','Minor 6th','Major 6th'];
    const intPool = shuffle([...easyIntervals, ...medIntervals], rng);
    for(let i=0;i<2;i++) qs.push(makeIntervalQuestion(intPool[i], rng, root));

    const chordNames = shuffle(Object.keys(CHORDS), rng);
    for(let i=0;i<2;i++) qs.push(makeChordQuestion(chordNames[i], rng, root));

    const progNames = shuffle(Object.keys(PROGRESSIONS), rng);
    for(let i=0;i<2;i++) qs.push(makeProgressionQuestion(progNames[i], rng, root));
  }

  return shuffle(qs, rng).map((q,i)=>({...q, index:i}));
}

// ---------- Progress / streak persistence ----------
function progressKey(mode){
  return `${STORAGE_KEY}_${mode}`;
}
function loadProgress(mode){
  try{
    return JSON.parse(localStorage.getItem(progressKey(mode))) || {};
  }catch(e){ return {}; }
}
function saveProgress(mode, p){
  localStorage.setItem(progressKey(mode), JSON.stringify(p));
}
function recordDailyResult(mode, score, total, grid){
  const p = loadProgress(mode);
  const key = todayKey();
  let streak = p.streak || 0;
  if(p.lastPlayedKey){
    const prevDate = new Date(p.lastPlayedKey.replace(/-/g,'/'));
    const todayDate = new Date(key.replace(/-/g,'/'));
    const diffDays = Math.round((todayDate - prevDate) / 86400000);
    if(diffDays === 1) streak += 1;
    else if(diffDays > 1) streak = 1;
    // diffDays === 0 shouldn't happen since we lock replays
  } else {
    streak = 1;
  }
  const updated = { lastPlayedKey:key, streak, score, total, grid };
  saveProgress(mode, updated);
  return updated;
}

let songPractice = { category:null, playedIds:[] };

function startSongPractice(category){
  songPractice = { category, playedIds:[] };
  showNextPracticeSong();
}

function showNextPracticeSong(){
  const { category } = songPractice;
  const all = SONGS_BANK.filter(s=>s.category===category);
  let unplayed = all.filter(s=>!songPractice.playedIds.includes(s.videoId));
  if(unplayed.length === 0){
    songPractice.playedIds = [];
    unplayed = all;
  }
  const song = unplayed[Math.floor(Math.random()*unplayed.length)];
  songPractice.playedIds.push(song.videoId);
  renderSongPractice(song);
}

function renderPianoVisual(key){

function blackKeyHtml(semi, semitoneLabel){

function beatLabels(v){
  if(v.triplet){
    const labels = [];
    for(let i=0;i<v.beats;i++) labels.push(i % 3 === 0 ? String(i/3 + 1) : '');
    return labels;
  }
  const labels = [];
  for(let i=0;i<v.beats;i++) labels.push(i % 2 === 0 ? String(i/2 + 1) : '&');
  return labels;
}

function renderPatternVisual(p){
  const v = p.visual;
  if(!v) return '';
  const cellW = v.beats > 9 ? 20 : 24;
  function row(values, extraCls){
    const cells = values.map((val, i)=>{
      const groupGap = v.triplet && i>0 && i % 3 === 0 ? 'margin-left:5px;' : '';
      return `<div class="pv-cell ${val?'filled':''} ${extraCls||''}" style="width:${cellW}px;${groupGap}">${val||''}</div>`;
    }).join('');
    return `<div class="pv-grid">${cells}</div>`;
  }
  return `
    <div class="pattern-visual">
      <div class="pv-row"><span class="pv-rowlabel">Ketuk</span>${row(beatLabels(v), 'beat')}</div>
      <div class="pv-row"><span class="pv-rowlabel">RH</span>${row(v.rh||[], '')}</div>
      <div class="pv-row"><span class="pv-rowlabel">LH</span>${row(v.lh||[], 'lh')}</div>

}

function renderChordTable(key){

// "IV", "vim", "V/VII", dst -> index 0-6 (I..VII), ga peduli besar/kecil huruf atau akhiran m
function romanDegreeIndex(token){
  const letters = normTok(token).replace(/m$/,'').toUpperCase();
  return ['I','II','III','IV','V','VI','VII'].indexOf(letters);
}
// terjemahin 1 token roman (boleh slash chord) ke chord huruf sesuai nada dasar manapun
function chordForRoman(token, key){
  const chordTable = KEY_CHORD_TABLE[key], scaleTable = SCALE_TABLE[key];
  if(!chordTable || !scaleTable) return token;
  const [top, bottom] = token.split('/');
  const topIdx = romanDegreeIndex(top);
  if(topIdx < 0) return token;
  const topChord = chordTable[topIdx];
  if(!bottom) return topChord;
  const botIdx = romanDegreeIndex(bottom);
  if(botIdx < 0) return topChord;
  return `${topChord}/${scaleTable[botIdx]}`;
}

// pilih ~70% index buat di-blank (minimal 1 kalau array-nya >1)
function pickBlankMask(len){
  const blankCount = Math.max(1, Math.round(len * 0.7));
  const idx = shuffle([...Array(len).keys()], Math.random);
  const mask = new Array(len).fill(false);
  idx.slice(0, blankCount).forEach(i=> mask[i]=true);
  return mask;
}

function embedUrl(videoId, startSeconds, endSeconds){

// grading token yang bisa kasih status "nyaris betul" (kuning) buat slash chord (mis. IV/I)
function gradeToken(userVal, correctVal){
  const u = normTok(userVal);
  const c = normTok(correctVal);
  if(!u) return 'wrong';
  if(u === c) return 'correct';
  if(c.includes('/')){
    const parts = c.split('/');
    if(parts.includes(u)) return 'near';
  }
  return 'wrong';
}
function tokenFeedback(grade, correctVal){
  if(grade === 'correct') return '';
  if(grade === 'near') return `<div class="gb-correction near">🟡 Nyaris betul — seharusnya menggunakan <strong>${correctVal}</strong></div>`;
  return `<div class="gb-correction wrong-text">❌ Seharusnya menggunakan <strong>${correctVal}</strong></div>`;
}

// pisahin voicing dari chord utama, mis. "IV(Maj7)" -> {main:"IV", voicing:"(Maj7)"}
// voicing cuma ditampilin sebagai info, ga ikut di-blank / dinilai
function splitVoicing(token){
  const m = token.match(/^(.*?)(\([^)]+\))$/);
  if(m) return { main: m[1], voicing: m[2] };
  return { main: token, voicing: '' };
}

// validasi format LIVE (bukan validasi jawaban benar/salah) — biar mereka sadar salah nulis
// jenis (angka romawi vs nama chord huruf) sebelum ngecek jawaban
function isRomanFormat(s){
  return /^[ivxIVX]+m?(\/[ivxIVX]+m?)?°?$/.test(s.trim());
}
function isChordFormat(s){
  return /^[A-Ga-g](#|b)?m?(\/[A-Ga-g](#|b)?)?$/.test(s.trim());
}

function renderGbPartProgression(partIndex, checked){
  gb.partIndex = partIndex;
  const partName = gb.guide.structureParts[partIndex];
  const part = gb.guide.allParts[partName];
  if(!gb.progress[partName]){
    gb.progress[partName] = { blanks: pickBlankMask(part.roman.length), answers: part.roman.map(()=>'') };
  }
  const prog = gb.progress[partName];
  const isFirst = partIndex === 0;
  const isLast = partIndex === gb.guide.structureParts.length - 1;

  const clipHtml = (part.startSeconds !== undefined || part.endSeconds !== undefined)
    ? `<div class="yt-embed-wrap compact" style="margin-bottom:16px;">
        <iframe src="${embedUrl(gb.song.videoId, part.startSeconds, part.endSeconds)}"
          title="${gb.song.title}" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>`
    : '';

  // render pakai notasi titik (kalau ada) biar ketukannya kelihatan & bisa diitung
  let linesHtml;
  // render 1 slot: voicing (kalau ada) selalu kelihatan & ga ikut di-blank, cuma chord utamanya yang jadi soal
  function renderRomanSlot(fullToken, myRi){
    const { main, voicing } = splitVoicing(fullToken);
    const voicingHtml = voicing ? `<span class="gb-voicing">${voicing}</span>` : '';
    if(prog.blanks[myRi]){
      const val = prog.answers[myRi];
      if(checked){
        const grade = gradeToken(val, main);
        const cls = grade === 'correct' ? 'correct' : grade === 'near' ? 'near' : 'wrong';
        return `<div><input class="gb-blank ${cls}" value="${val}" disabled>${voicingHtml}${tokenFeedback(grade, main)}</div>`;
      }
      return `<div><input class="gb-blank" data-ri="${myRi}" maxlength="6" value="${val}">${voicingHtml}</div>`;
    }
    return `<div class="gb-token">${main}${voicingHtml}</div>`;
  }

  if(part.bars){
    let ri = 0;
    linesHtml = part.bars.map((line, li)=>{
      const tokens = line.map(slot=>{
        if(slot === null) return `<div class="gb-dot">•</div>`;
        return renderRomanSlot(slot, ri++);
      }).join('');
      return `<div class="gb-line"><div class="gb-line-label">Baris ${li+1}</div><div class="gb-tokens">${tokens}</div></div>`;
    }).join('');
  } else {
    const tokens = part.roman.map((r, ri)=> renderRomanSlot(r, ri)).join('');
    linesHtml = `<div class="gb-line"><div class="gb-line-label">${partName}</div><div class="gb-tokens">${tokens}</div></div>`;
  }

  mainCard.innerHTML = `
    ${gbHeader(`Halaman 3 — ${partIndex+1}/${gb.guide.structureParts.length}`)}
    <div class="qtitle">🔢 Tebak Progresinya — [${partName}]</div>
    ${clipHtml}
    <div class="step-label">Tebak progresinya (I-VII). Titik (•) = ketukan lanjutan, ikut dihitung biar pas sama iramanya.</div>
    ${linesHtml}
    <div class="gb-nav">
      <button class="btn-secondary" id="gbPrevBtn">← Sebelumnya</button>
      <button class="play-btn" id="gbNextBtn" style="margin-bottom:0;">${checked ? (isLast ? 'Lanjut ke Translate Chord →' : 'Bagian Berikutnya →') : 'Cek Jawaban ✓'}</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderSongPractice(gb.song);
  if(!checked){
    document.querySelectorAll('.gb-blank').forEach(inp=>{
      inp.oninput = ()=>{
        const ri = +inp.getAttribute('data-ri');
        prog.answers[ri] = inp.value.trim();
        inp.classList.toggle('format-bad', inp.value.trim() !== '' && !isRomanFormat(inp.value));
      };
    });
    attachEnterNav();
  }
  document.getElementById('gbPrevBtn').onclick = ()=>{
    if(isFirst) renderGbAccompanyIntro();
    else renderGbPartProgression(partIndex-1, true);
  };
  document.getElementById('gbNextBtn').onclick = ()=>{
    if(!checked){ renderGbPartProgression(partIndex, true); return; }
    if(isLast) renderGbChordTranslate();
    else renderGbPartProgression(partIndex+1);
  };
}

// rentang video gabungan: dari awal bagian pertama sampai akhir bagian terakhir
function fullPartsRange(guide){
  const parts = guide.structureParts.map(n=> guide.allParts[n]);
  const start = parts[0].startSeconds;
  const end = parts[parts.length-1].endSeconds;
  return { start, end };
}

function renderGbChordTranslate(checked){
  const key = gb.keyGuess || gb.guide.key;
  gb.guide.structureParts.forEach(partName=>{
    if(!gb.chordAnswers[partName]) gb.chordAnswers[partName] = gb.guide.allParts[partName].chords.map(()=>'');
  });
  const range = fullPartsRange(gb.guide);

  const sectionsHtml = gb.guide.structureParts.map(partName=>{
    const part = gb.guide.allParts[partName];
    const romanLine = part.roman.join(' - ');

      const val = gb.chordAnswers[partName][ci];

        const grade = gradeToken(val, c);
        const cls = grade === 'correct' ? 'correct' : grade === 'near' ? 'near' : 'wrong';
        return `<div><input class="gb-blank ${cls}" value="${val}" disabled>${tokenFeedback(grade, c)}</div>`;
      }
      return `<input class="gb-blank" data-part="${partName}" data-ci="${ci}" maxlength="6" value="${val}">`;
    }).join('');
    return `<div class="gb-line">
      <div class="gb-line-label">[${partName}] <span style="color:var(--accent2);font-weight:700;">${romanLine}</span></div>
      <div class="gb-tokens">${chordHtml}</div>
    </div>`;
  }).join('');

  mainCard.innerHTML = `
    ${gbHeader('Halaman 4')}
    <div class="qtitle">🎼 Translate ke Chord</div>
    <div class="yt-embed-wrap compact" style="margin-bottom:16px;">
      <iframe src="${embedUrl(gb.song.videoId, range.start, range.end)}"
        title="${gb.song.title}" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="step-label">Nada dasar lagu ini <strong>do = ${key}</strong>. Berdasarkan progresi yang udah kebahas, chordnya jadi apa? (pakai tabel family chord di bawah kalau perlu)</div>
    ${gb.guide.modulationNote ? `<div class="gb-feedback no" style="text-align:left;">⚠️ ${gb.guide.modulationNote}</div>` : ''}
    ${renderChordTable(key)}
    ${sectionsHtml}
    <div class="gb-nav">
      <button class="btn-secondary" id="gbPrevBtn">← Sebelumnya</button>
      <button class="play-btn" id="gbNextBtn" style="margin-bottom:0;">${checked ? 'Lanjut →' : 'Cek Jawaban ✓'}</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderSongPractice(gb.song);
  if(!checked){
    attachEnterNav();
    document.querySelectorAll('.gb-blank').forEach(inp=>{
      inp.oninput = ()=>{
        const partName = inp.getAttribute('data-part'), ci = +inp.getAttribute('data-ci');
        gb.chordAnswers[partName][ci] = inp.value.trim();
        inp.classList.toggle('format-bad', inp.value.trim() !== '' && !isChordFormat(inp.value));
      };
    });
  }
  document.getElementById('gbPrevBtn').onclick = ()=> renderGbPartProgression(gb.guide.structureParts.length-1, true);
  document.getElementById('gbNextBtn').onclick = ()=> checked ? renderGbPattern() : renderGbChordTranslate(true);
}

function renderGbPattern(checked){
  if(gb.patternOptions === undefined){
    const correctIds = gb.guide.correctPatternIds || [];
    const wrongPool = gb.guide.wrongPatternIds
      ? PATTERN_BANK.filter(p=>gb.guide.wrongPatternIds.includes(p.id))
      : PATTERN_BANK.filter(p=>!correctIds.includes(p.id));
    const correctPicks = shuffle(PATTERN_BANK.filter(p=>correctIds.includes(p.id)), Math.random).slice(0,2);
    const wrongPicks = shuffle(wrongPool, Math.random).slice(0,3);
    gb.patternOptions = shuffle([...correctPicks, ...wrongPicks], Math.random);
  }
  const correctIds = gb.guide.correctPatternIds || [];
  const optsHtml = gb.patternOptions.map(p=>{
    const selected = gb.patternPicks.includes(p.id);
    const isCorrectPattern = correctIds.includes(p.id);
    let cls = '';
    if(checked){
      if(selected && isCorrectPattern) cls = ' correct';
      else if(selected && !isCorrectPattern) cls = ' wrong-pick';
      else if(!selected && isCorrectPattern) cls = ' missed';
    } else if(selected) cls = ' selected';
    const badge = checked && isCorrectPattern ? '✅' : (checked && selected && !isCorrectPattern ? '❌' : '');
    return `<div class="pattern-pick${cls}" data-id="${p.id}" style="position:relative;">
      ${badge ? `<span style="position:absolute;top:8px;right:10px;font-size:14px;">${badge}</span>` : ''}
      ${renderPatternVisual(p)}
    </div>`;
  }).join('');

  mainCard.innerHTML = `
    ${gbHeader('Halaman 5')}
    <div class="qtitle">🥁 Pilih Pattern yang Cocok</div>
    <div class="step-label">${gb.guide.patternNote || ''} Pilih 2 pattern yang paling cocok buat lagu ini.</div>
    ${optsHtml}
    <div class="gb-nav">
      <button class="btn-secondary" id="gbPrevBtn">← Sebelumnya</button>
      <button class="play-btn" id="gbNextBtn" style="margin-bottom:0;" ${!checked && gb.patternPicks.length<2 ? 'disabled' : ''}>${checked ? 'Lihat Skor →' : 'Cek Jawaban ✓'}</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderSongPractice(gb.song);
  if(!checked){
    document.querySelectorAll('.pattern-pick').forEach(el=>{
      el.onclick = ()=>{
        const id = el.getAttribute('data-id');
        if(gb.patternPicks.includes(id)){
          gb.patternPicks = gb.patternPicks.filter(x=>x!==id);
        } else if(gb.patternPicks.length < 2){
          gb.patternPicks.push(id);
        }
        renderGbPattern();
      };
    });
  }
  document.getElementById('gbPrevBtn').onclick = ()=> renderGbChordTranslate(true);
  document.getElementById('gbNextBtn').onclick = ()=> checked ? renderGbScore() : renderGbPattern(true);
}

function normTok(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,''); }

// tekan Enter di kolom isian -> pindah ke kolom kosong berikutnya (bukan submit)
function attachEnterNav(){
  const inputs = [...document.querySelectorAll('.gb-blank:not([disabled])')];
  inputs.forEach((inp, i)=>{
    inp.onkeydown = (e)=>{
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const next = inputs[i+1];
      if(next) next.focus();
      else inp.blur();
    };
  });
}

function scoreFlat(blanks, answers, correct){
  let total = 0, right = 0;
  blanks.forEach((isBlank, i)=>{
    if(!isBlank) return;
    total++;
    if(normTok(answers[i]) === normTok(correct[i])) right++;
  });
  return total === 0 ? 1 : right/total;
}

function renderGbScore(){
  const keyScore = gb.keyGuess === gb.guide.key ? 1 : 0;

  // rata-rata skor progresi dari semua bagian struktur
  let progTotal = 0;
  gb.guide.structureParts.forEach(partName=>{
    const part = gb.guide.allParts[partName];
    const prog = gb.progress[partName];
    progTotal += scoreFlat(prog.blanks, prog.answers, part.roman);
  });
  const progScore = progTotal / gb.guide.structureParts.length;

  // skor translate chord — gabungan semua bagian, semua terisi (bukan blank sebagian)
  let chordRight = 0, chordTotal = 0;
  gb.guide.structureParts.forEach(partName=>{
    const part = gb.guide.allParts[partName];
    const answers = gb.chordAnswers[partName];
    part.chords.forEach((c, ci)=>{
      chordTotal++;
      if(normTok(answers[ci]) === normTok(c)) chordRight++;
    });
  });
  const chordScore = chordTotal === 0 ? 1 : chordRight / chordTotal;

  const correctIds = gb.guide.correctPatternIds || [];
  const patternHits = gb.patternPicks.filter(id=>correctIds.includes(id)).length;
  const patternScore = patternHits / 2;

  const weights = { key:0.15, progression:0.30, chord:0.35, pattern:0.20 };
  const total = keyScore*weights.key + progScore*weights.progression + chordScore*weights.chord + patternScore*weights.pattern;
  const breakdownHtml = `
    <div class="sb-row"><span>🎯 Nada Dasar</span><span>${Math.round(keyScore*100)}%</span></div>
    <div class="sb-row"><span>🔢 Progresi (semua bagian)</span><span>${Math.round(progScore*100)}%</span></div>
    <div class="sb-row"><span>🎼 Translate Chord</span><span>${Math.round(chordScore*100)}%</span></div>
    <div class="sb-row"><span>🥁 Pattern</span><span>${Math.round(patternScore*100)}%</span></div>
  `;

  const finalScore = Math.max(1, Math.round(total*100));

  let verdict;
  if(finalScore >= 90) verdict = 'Gila, telinga & teori kamu udah matang! 🏆';
  else if(finalScore >= 70) verdict = 'Bagus banget, tinggal dipoles dikit lagi.';
  else if(finalScore >= 50) verdict = 'Lumayan, terus diasah ya.';
  else verdict = 'Masih perlu banyak latihan, gapapa — coba lagi!';

  if(!gb.summaryKey) gb.summaryKey = gb.guide.key;
  const range = fullPartsRange(gb.guide);
  const correctPatterns = PATTERN_BANK.filter(p=>correctIds.includes(p.id));

  mainCard.innerHTML = `
    ${gbHeader('Hasil')}
    <div class="results">
      <div class="qtitle" style="margin-bottom:0;">Hasil Bedah Lagu</div>
      <div class="score-big">${finalScore}</div>
      <div class="score-label">${verdict}</div>
      <div class="score-breakdown">
        ${breakdownHtml}
      </div>
      <div class="qtitle" style="text-align:left;font-size:16px;margin-top:22px;">📋 Ringkasan Jawaban Benar</div>
      <div class="yt-embed-wrap compact" style="margin:10px 0 14px;">
        <iframe src="${embedUrl(gb.song.videoId, range.start, range.end)}"
          title="${gb.song.title}" frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <div class="step-label" style="text-align:left;">Coba ganti nada dasar buat latihan — chord di bawah otomatis nyesuain.</div>
      <select class="gb-select" id="summaryKeySelect">
        ${Object.keys(SCALE_TABLE).map(k=>`<option value="${k}" ${k===gb.summaryKey?'selected':''}>do = ${k}</option>`).join('')}
      </select>
      <div id="summaryChords" style="text-align:left;"></div>
      <div class="qtitle" style="text-align:left;font-size:16px;margin-top:18px;">Pattern yang cocok</div>
      <div style="text-align:left;">
        ${correctPatterns.map(p=>`<div class="gb-line">${renderPatternVisual(p)}</div>`).join('')}
      </div>
      <button class="play-btn" id="gbRetryBtn" style="margin-top:18px;">🔁 Ulangi Bagian Ini</button>
      <button class="btn-secondary" id="gbDoneBtn" style="width:100%;margin-top:10px;">Selesai — Kembali ke Lagu</button>
    </div>
  `;
  function renderSummaryChords(){
    const key = gb.summaryKey;
    document.getElementById('summaryChords').innerHTML = gb.guide.structureParts.map(partName=>{
      const part = gb.guide.allParts[partName];
      const label = `[${partName}] ${part.roman.join(' - ')}`;
      // ikutin notasi titik (kalau ada) biar konsisten sama halaman tebak progresi
      if(part.bars){
        const linesHtml = part.bars.map((line, li)=>{
          const tokens = line.map(slot=>{
            if(slot === null) return `<div class="gb-dot">•</div>`;
            const { main, voicing } = splitVoicing(slot);
            const voicingHtml = voicing ? `<span class="gb-voicing">${voicing}</span>` : '';
            return `<div class="gb-token">${chordForRoman(main, key)}${voicingHtml}</div>`;
          }).join('');
          return `<div class="gb-line"><div class="gb-line-label">${li===0?label:'&nbsp;'}</div><div class="gb-tokens">${tokens}</div></div>`;
        }).join('');
        return linesHtml;
      }
      return `<div class="gb-line"><div class="gb-line-label">${label}</div><div class="gb-tokens">${part.roman.map(r=>`<div class="gb-token">${chordForRoman(r,key)}</div>`).join('')}</div></div>`;
    }).join('');
  }
  renderSummaryChords();
  document.getElementById('summaryKeySelect').onchange = (e)=>{
    gb.summaryKey = e.target.value;
    renderSummaryChords();
  };
  document.getElementById('backBtn') && (document.getElementById('backBtn').onclick = ()=> renderSongPractice(gb.song));
  document.getElementById('gbRetryBtn').onclick = ()=>{
    const song = gb.song, guide = gb.guide;
    startGuidedBreakdown(song, guide);
  };
  document.getElementById('gbDoneBtn').onclick = ()=> renderSongPractice(gb.song);
}

function renderStart(mode){
  selectedMode = mode;
  h1El.textContent = MODES[mode].title;
  const p = loadProgress(mode);
  if(p.lastPlayedKey === todayKey()){
    setBadge('daily', p.streak);
    renderAlreadyPlayed(p);
    return;
  }
  setBadge('daily', p.streak || 0);
  const noteHtml = mode === 'all'
    ? `<div class="difficulty-note">
        <span><span class="diff-dot" style="background:var(--green)"></span>Interval</span>
        <span><span class="diff-dot" style="background:var(--accent)"></span>Chord</span>
        <span><span class="diff-dot" style="background:var(--accent2)"></span>Progresi</span>
      </div>`
    : '';
  mainCard.innerHTML = `
    <button class="back-link" id="backBtn">← Ganti Mode</button>
    <div class="start-screen">
      <div class="qtitle">${MODES[mode].icon} ${MODES[mode].label}</div>
      <p>${MODES[mode].desc}. Semua level bisa main!</p>
      ${noteHtml}
      <button class="play-btn" id="startBtn" style="margin-top:14px;">Mulai Sekarang</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderModeSelect();
  document.getElementById('startBtn').onclick = ()=>{
    isPractice = false;
    questions = buildQuestions(dateSeed(), mode);
    current = 0;
    results = [];
    renderQuestion();
  };
}

function renderAlreadyPlayed(p){
  mainCard.innerHTML = `
    <button class="back-link" id="backBtn">← Ganti Mode</button>
    <div class="results">
      <div class="qtitle" style="margin-bottom:0;">Kamu sudah main hari ini</div>
      <div class="score-big">${p.score}/${p.total}</div>
      <div class="score-label">🔥 Streak ${p.streak} hari</div>
      <div class="grid-preview">${p.grid}</div>
      <div class="countdown-box">⏱ Soal baru dalam <span id="countdown">00:00:00</span></div>
      <button class="share-btn" id="shareBtn">📋 Salin Hasil untuk Dibagikan</button>
      <a class="cta-btn" id="ctaBtn" href="https://mustimusik.id" target="_blank" rel="noopener">🎵 Kunjungi Musti Musik →</a>
      <div class="cta-sub">Cek kelas & program musik lainnya di Musti Musik.</div>
      <button class="retry-btn" id="practiceBtn">Main Lagi (Mode Latihan)</button>
      <div class="copied-toast" id="toast"></div>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderModeSelect();
  document.getElementById('shareBtn').onclick = ()=> copyShareText(p.score, p.total, p.grid);
  document.getElementById('practiceBtn').onclick = ()=> startPractice();
  document.getElementById('ctaBtn').onclick = ()=> fetch('/wp-admin/admin-ajax.php?action=tebaknada_cta_click', {method:'POST'}).catch(()=>{});
  const countdownEl = document.getElementById('countdown');
  if(countdownTimer) clearInterval(countdownTimer);
  countdownEl.textContent = formatCountdown(msUntilMidnight());
  countdownTimer = setInterval(()=>{
    countdownEl.textContent = formatCountdown(msUntilMidnight());
  }, 1000);
}

function startPractice(){
  if(countdownTimer) clearInterval(countdownTimer);
  isPractice = true;
  setBadge('practice');
  questions = buildQuestions(Date.now(), selectedMode);
  current = 0;
  results = [];
  renderQuestion();
}

function renderProgressDots(){
  let html = '<div class="progress-row">';
  for(let i=0;i<questions.length;i++){
    let cls = 'dot';
    if(i < results.length) cls += results[i] ? ' correct' : ' wrong';
    else if(i === current) cls += ' current';
    html += `<div class="${cls}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderQuestion(){
  answered = false;
  const q = questions[current];
  mainCard.innerHTML = `
    ${renderProgressDots()}
    <div class="qnum">Soal ${current+1} dari ${questions.length}</div>
    <div class="qtitle">${q.title}</div>
    ${q.subtitle ? `<div class="sub" style="text-align:left;margin:-14px 0 18px;">${q.subtitle}</div>` : ''}
    <button class="play-btn" id="playBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Putar Suara
    </button>
    <div class="options" id="optionsWrap">
      ${q.options.map(opt=>`<button class="opt" data-opt="${opt}">${opt}</button>`).join('')}
    </div>
    <div class="explain-box" id="explainBox"></div>
    <button class="next-btn" id="nextBtn">${current === questions.length-1 ? 'Lihat Hasil' : 'Soal Berikutnya →'}</button>
  `;
  document.getElementById('playBtn').onclick = ()=> q.play();
  if(!q.subtitle) setTimeout(()=> q.play(), 300);

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(answered) return;
      answered = true;
      const chosen = btn.getAttribute('data-opt');
      const correct = chosen === q.answer;
      results.push(correct);
      document.querySelectorAll('.opt').forEach(b=>{
        b.disabled = true;
        const val = b.getAttribute('data-opt');
        if(val === q.answer) b.classList.add(correct ? 'selected-correct':'reveal-correct');
        if(val === chosen && !correct) b.classList.add('selected-wrong');
      });
      const explanation = (EXPLANATIONS[q.type] || {})[q.answer] || '';
      const explainBox = document.getElementById('explainBox');
      explainBox.innerHTML = correct
        ? `<strong>✅ Tepat!</strong> ${explanation}`
        : `<strong>Bukan ${chosen}</strong> — jawabannya <strong>${q.answer}</strong>. ${explanation}`;
      explainBox.classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
    };
  });

  document.getElementById('nextBtn').onclick = ()=>{
    if(current === questions.length-1){
      renderResults();
    } else {
      current++;
      renderQuestion();
    }
  };
}

function scoreEmoji(correct){ return correct ? '🟩' : '🟥'; }

function copyShareText(score, total, grid){
  const text = `Tebak Nada — ${todayString()}\n${score}/${total} ${grid}\n\nBerani coba? Kalahin skorku! 🎧\n${SITE_URL}`;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('toast').textContent = 'Disalin! Tempel di mana saja.';
    setTimeout(()=> document.getElementById('toast').textContent = '', 2500);
  }).catch(()=>{
    document.getElementById('toast').textContent = text;
  });
}

function renderResults(){
  const score = results.filter(Boolean).length;
  const total = results.length;
  const grid = results.map(scoreEmoji).join('');
  let verdict;
  if(score === total) verdict = "Telinga emas. 🎯";
  else if(score >= total*0.75) verdict = "Telingamu tajam banget.";
  else if(score >= total*0.5) verdict = "Lumayan! Masih bisa diasah.";
  else verdict = "Semua orang mulai dari nol 🌱";

  let streakLine = '';
  let resetNote = '';
  if(!isPractice){
    const updated = recordDailyResult(selectedMode, score, total, grid);
    setBadge('daily', updated.streak);
    if(updated.streak > 1) streakLine = `<div class="score-label">🔥 Streak ${updated.streak} hari berturut-turut!</div>`;
    resetNote = `<div class="countdown-box">🔄 Soal baru tiap hari jam 00:00 — balik lagi besok!</div>`;
    fetch('/wp-admin/admin-ajax.php?action=tebaknada_count', {method:'POST'}).catch(()=>{});
  }

  mainCard.innerHTML = `
    <button class="back-link" id="backBtn">← Ganti Mode</button>
    <div class="results">
      <div class="qtitle" style="margin-bottom:0;">${isPractice ? 'Hasil Latihan' : 'Hasil Hari Ini'}</div>
      <div class="score-big">${score}/${total}</div>
      <div class="score-label">${verdict}</div>
      ${streakLine}
      <div class="grid-preview">${grid}</div>
      ${resetNote}
      <button class="share-btn" id="shareBtn">📋 Salin Hasil untuk Dibagikan</button>
      <a class="cta-btn" id="ctaBtn" href="https://mustimusik.id" target="_blank" rel="noopener">🎵 Kunjungi Musti Musik →</a>
      <div class="cta-sub">Cek kelas & program musik lainnya di Musti Musik.</div>
      <button class="retry-btn" id="retryBtn">Main Lagi (Mode Latihan)</button>
      <div class="copied-toast" id="toast"></div>
    </div>
  `;
  document.getElementById('backBtn').onclick = ()=> renderModeSelect();
  document.getElementById('shareBtn').onclick = ()=> copyShareText(score, total, grid);
  document.getElementById('retryBtn').onclick = ()=> startPractice();
  document.getElementById('ctaBtn').onclick = ()=> fetch('/wp-admin/admin-ajax.php?action=tebaknada_cta_click', {method:'POST'}).catch(()=>{});
}

renderModeSelect();
</script>
